[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holodream"
version = "0.1.0"
description = "Six-lane rhythm-game live Assist with manual input activation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9"]

[project.optional-dependencies]
live = [
  "mss>=9.0; sys_platform == 'win32'",
  "dxcam>=0.0.5; sys_platform == 'win32'",
]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
